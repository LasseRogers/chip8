name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rl
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Download ROMs used by the tests
        run: |
          mkdir -p ../roms
          base="https://github.com/kripod/chip8-roms/raw/master/games"
          curl -sSfL -o ../roms/pong1p.ch8 "$base/Pong%20%281%20player%29.ch8"
          curl -sSfL -o ../roms/invaders.ch8 "$base/Space%20Invaders%20%5BDavid%20Winter%5D.ch8"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q
