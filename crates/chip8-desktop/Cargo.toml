[package]
name = "chip8-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
chip8-core = { version = "0.1.0", path = "../chip8-core" }

# X11 only on Linux: loaded at runtime, no system headers needed. Works under XWayland.
[target.'cfg(target_os = "linux")'.dependencies]
minifb = { version = "0.29", default-features = false, features = ["x11"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
minifb = "0.29"
