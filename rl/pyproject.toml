[project]
name = "chip8-rl"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chip8",
    "gymnasium>=1.4.0",
    "imageio>=2.38.2",
    "imageio-ffmpeg>=0.8.1",
    "numpy>=2.5.5",
    "pygame>=2.6.1",
    "torch>=2.15.0",
]

[tool.uv.sources]
chip8 = { path = "../crates/chip8-py", editable = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Errors, unused code, import order, likely bugs, modern syntax, simplifications.
select = ["E", "F", "I", "B", "UP", "SIM"]
